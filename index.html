<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 아이가 생겼어요. 잘 키워볼게요.</title>
<style>
  :root {
    --bg: #fff7f0; --bg2: #ffe9dc; --text: #4a3b35; --muted: #8a756b;
    --accent: #ff8a6b; --accent-press: #f2704e; --on-accent: #ffffff;
    --card: #ffffff; --line: #f1d9cb; --chip: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1a18; --bg2: #2c2320; --text: #f6ebe4; --muted: #b8a39a;
      --accent: #ff9a7e; --accent-press: #ff8061; --on-accent: #2a1a14;
      --card: #2a2320; --line: #43362f; --chip: #2a2320;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1a18; --bg2: #2c2320; --text: #f6ebe4; --muted: #b8a39a;
    --accent: #ff9a7e; --accent-press: #ff8061; --on-accent: #2a1a14;
    --card: #2a2320; --line: #43362f; --chip: #2a2320;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { min-height: 100%; background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  #intro {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 24px; gap: 16px;
  }
  .emoji { font-size: clamp(64px, 20vw, 96px); line-height: 1; animation: float 3s ease-in-out infinite; }
  h1 { margin: 8px 0 0; font-size: clamp(26px, 7vw, 38px); line-height: 1.35; letter-spacing: -0.02em; word-break: keep-all; max-width: 14em; }
  #intro p { margin: 0; font-size: clamp(15px, 4vw, 18px); color: var(--muted); line-height: 1.6; word-break: keep-all; max-width: 22em; }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #startBtn {
    margin-top: 20px; min-width: 200px; padding: 16px 36px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); font-size: 18px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(255, 138, 107, 0.35); transition: transform 0.1s ease, background 0.15s ease;
  }
  #startBtn:hover { background: var(--accent-press); }
  #startBtn:active { transform: scale(0.97); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

  #explore { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .back { border: 0; background: none; color: var(--muted); font-size: 15px; padding: 8px 4px; }
  h2 { margin: 4px 0 4px; font-size: 22px; letter-spacing: -0.02em; }
  .sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; word-break: keep-all; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 9px 15px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--chip); color: var(--text); font-size: 14px; white-space: nowrap;
  }
  .chip[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
  .card h3 { margin: 0; font-size: 20px; }
  .meta { margin: 4px 0 12px; color: var(--muted); font-size: 14px; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
  .size { margin: 14px 0 0; font-weight: 700; }
  .blk { margin-top: 16px; }
  .blk b { display: block; margin-bottom: 4px; font-size: 14px; color: var(--accent); }
  .blk p { margin: 0; line-height: 1.7; word-break: keep-all; }
  .note { margin: 16px 4px 0; color: var(--muted); font-size: 12px; line-height: 1.6; word-break: keep-all; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .emoji { animation: none; } }
</style>
</head>
<body>
  <main id="intro">
    <div class="emoji" aria-hidden="true">🍼</div>
    <h1>우리 아이가 생겼어요.<br>잘 키워볼게요.😊</h1>
    <p>작은 생명과 함께 시작하는 첫 하루,<br>엄마도, 아빠도 천천히 배우며 함께 자라요.</p>
    <button id="startBtn" type="button">시작</button>
  </main>

  <section id="explore" hidden>
    <div class="top"><button class="back" id="backBtn" type="button">← 처음으로</button></div>
    <h2>임신 시기별 특징 보기</h2>
    <p class="sub">수정부터 출산까지, 시기를 눌러 아기와 엄마의 변화를 확인해요.</p>
    <div class="chips" id="chips" role="tablist" aria-label="임신 시기"></div>
    <article class="card" id="card" aria-live="polite"></article>
    <p class="note">고등학교 생명과학에서 배우는 수정·임신·출산 내용을 바탕으로 정리한 일반적인 학습용 요약이에요. 크기와 시기는 대략적인 값이며 사람마다 달라요. 개월은 마지막 월경 시작일 기준(4주≈1개월)이고, 실제 임신 관리는 의료진과 상담하세요.</p>
  </section>

<script>
(function () {
  var D = [
    {t:"수정·착상", w:"임신 전~약 3주", s:"수정란 약 0.1mm", p:3,
     b:"배란된 난자가 수란관에서 정자와 만나 수정돼요. 수정란은 난할을 하며 자궁으로 이동해 약 일주일 뒤 자궁 내막에 착상해요.",
     m:"아직 몸의 변화를 느끼기 어려워요. 착상 무렵 소량의 출혈이 있을 수 있어요.",
     k:"수정은 수란관에서, 착상은 자궁 내막에서 일어나요. 착상이 되면 임신이 성립해요."},
    {t:"1개월", w:"1~4주", s:"약 1mm 내외", p:10,
     b:"착상한 배아 주변에서 태반과 탯줄이 만들어지기 시작해요.",
     m:"월경이 멈추고 임신 테스트기에 반응이 나타나기 시작해요.",
     k:"착상 후 분비되는 호르몬(hCG)이 황체를 유지시켜요. 임신 중에는 배란과 월경이 일어나지 않아요."},
    {t:"2개월", w:"5~8주", s:"약 3cm", p:20,
     b:"배아기예요. 심장이 뛰기 시작하고 뇌·척수·눈·팔다리의 기본 구조가 만들어져요.",
     m:"입덧, 피로감, 유방 압통이 나타나기 쉬워요.",
     k:"기관의 기초가 만들어지는 시기라 약물·감염·음주 같은 영향에 특히 민감해요."},
    {t:"3개월", w:"9~12주", s:"약 6~7cm · 약 15g", p:30,
     b:"손가락·발가락이 나뉘고 얼굴 윤곽이 생겨요. 주요 기관이 거의 갖춰져요.",
     m:"입덧이 절정을 지나 서서히 줄고, 소변을 자주 봐요.",
     k:"수정 후 약 8주까지는 배아, 그 뒤부터 출생 전까지는 ‘태아’라고 불러요."},
    {t:"4개월", w:"13~16주", s:"약 12cm · 약 100g", p:40,
     b:"외부 생식기가 구분돼 초음파로 성별을 알 수 있기도 해요. 뼈와 근육이 발달해요.",
     m:"입덧이 줄고 식욕이 늘며 배가 조금씩 나와요.",
     k:"태반이 완성돼요. 태반에서 산소·영양소·노폐물을 교환하고, 에스트로젠과 프로게스테론을 분비해 임신을 유지해요."},
    {t:"5개월", w:"17~20주", s:"약 25cm · 약 300g", p:50,
     b:"청각이 발달하고 피부에 솜털과 태지가 생겨요. 팔다리를 활발히 움직여요.",
     m:"첫 태동을 느끼기 시작하고, 배가 눈에 띄게 나와요.",
     k:"양수는 태아를 충격에서 보호하고 체온을 일정하게 유지해 줘요."},
    {t:"6개월", w:"21~24주", s:"약 30cm · 약 600g", p:60,
     b:"머리카락과 눈썹이 자라고 지문이 생겨요. 폐가 발달하기 시작해요.",
     m:"허리 통증과 튼살이 생기기 쉬워요. 임신성 당뇨 검사를 받는 시기예요(24~28주).",
     k:"태아는 탯줄을 통해 엄마와 영양소·산소·노폐물을 주고받아요."},
    {t:"7개월", w:"25~28주", s:"약 35cm · 약 1kg", p:70,
     b:"눈을 뜨고 뇌가 빠르게 발달해요. 이 시기에 태어나도 집중 치료로 생존할 가능성이 높아져요.",
     m:"숨이 차고 다리가 붓기 쉬워요.",
     k:"태아와 엄마의 혈액은 섞이지 않고, 태반의 얇은 막을 사이에 두고 물질이 이동해요."},
    {t:"8개월", w:"29~32주", s:"약 42cm · 약 1.7kg", p:80,
     b:"피부 아래 지방이 쌓여 통통해지고 폐가 성숙해져요.",
     m:"불규칙하게 배가 뭉치는 가진통이 생기고 소화가 잘 안 될 수 있어요.",
     k:"엄마의 항체가 태반을 통해 태아에게 전달돼 출생 직후의 면역을 도와요."},
    {t:"9개월", w:"33~36주", s:"약 47cm · 약 2.6kg", p:90,
     b:"대부분 머리가 아래(자궁 입구 쪽)로 향해 출산 자세를 잡아요.",
     m:"골반이 눌려 소변이 잦고 잠들기 어려울 수 있어요.",
     k:"출산이 가까워지면 자궁이 수축하기 쉬운 상태로 바뀌어요."},
    {t:"10개월", w:"37~40주", s:"약 50cm · 약 3.2kg", p:100,
     b:"모든 기관이 성숙한 만삭 상태예요. 언제든 태어날 준비를 마쳐요.",
     m:"이슬이 비치거나 규칙적인 진통, 양수 터짐이 있으면 병원에 가요.",
     k:"임신 기간은 마지막 월경 시작일부터 약 280일(40주), 수정일부터는 약 266일이에요."},
    {t:"출산", w:"진통~분만", s:"신생아 약 3kg · 50cm", p:100,
     b:"분만은 ① 진통으로 자궁 입구가 열림 → ② 태아 만출 → ③ 태반 만출 순서로 진행돼요.",
     m:"분만 뒤에는 젖 분비가 시작되고 자궁이 서서히 원래 크기로 돌아와요.",
     k:"옥시토신은 자궁 수축과 젖 분비(사출)를, 프로락틴은 젖 생성을 촉진해요."}
  ];
  var intro = document.getElementById('intro'), explore = document.getElementById('explore');
  var chips = document.getElementById('chips'), card = document.getElementById('card');

  D.forEach(function (d, i) {
    var c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.setAttribute('role', 'tab');
    c.textContent = d.t;
    c.addEventListener('click', function () { show(i); });
    chips.appendChild(c);
  });

  function show(i) {
    var d = D[i], list = chips.children;
    for (var j = 0; j < list.length; j++) list[j].setAttribute('aria-selected', j === i ? 'true' : 'false');
    list[i].scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    card.innerHTML =
      '<h3></h3><p class="meta"></p><div class="bar"><i></i></div><p class="size"></p>' +
      '<div class="blk"><b>👶 아기</b><p></p></div>' +
      '<div class="blk"><b>🤰 엄마</b><p></p></div>' +
      '<div class="blk"><b>📖 교과서 포인트</b><p></p></div>';
    var q = card.querySelectorAll('h3,.meta,.size,.blk p');
    q[0].textContent = d.t; q[1].textContent = d.w; q[2].textContent = '크기: ' + d.s;
    q[3].textContent = d.b; q[4].textContent = d.m; q[5].textContent = d.k;
    card.querySelector('.bar i').style.width = d.p + '%';
  }

  document.getElementById('startBtn').addEventListener('click', function () {
    intro.hidden = true; explore.hidden = false; show(0); window.scrollTo(0, 0);
  });
  document.getElementById('backBtn').addEventListener('click', function () {
    explore.hidden = true; intro.hidden = false; window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
